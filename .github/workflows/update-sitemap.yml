name: Update OpenSim Sitemap

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OpenSim Sitemap Generator
        run: |
          python generate_opensim_sitemap.py

      - name: Commit and push updated sitemap
        run: |
          git config user.name "Aaron Sells"
          git config user.email "aaron.b.sells@nasa.gov"
          git add opensim_sitemap.xml opensim_urls.txt
          if git diff --staged --quiet; then
            echo "No changes in OpenSim sitemap. Skipping commit."
          else
            git commit -m "chore(sitemap): weekly automated OpenSim documentation synchronization [skip ci]"
            git push origin main
          fi
